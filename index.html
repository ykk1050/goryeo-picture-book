<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고려 역사 그림책</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --jade:#3f8f86; --jade-dark:#2a6660; --jade-soft:#e6f3f0; --jade-line:#b9dcd5;
  --ink:#1f2d2b; --muted:#5f716e; --bg:#eef3f1; --card:#ffffff; --line:#dbe5e2;
  --gold:#b8862f; --gold-soft:#fbf3e2; --red:#c2463d; --red-soft:#fdecea;
  --blue:#3d6fb5; --blue-soft:#eaf1fb; --ex:#f4f7fb; --ex-line:#d3ddea;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,#e9f2ef,#dfe8ee);color:var(--ink);
  font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.6}
button,input,textarea,select{font-family:inherit;font-size:inherit}
.wrap{max-width:1040px;margin:0 auto;padding-block:24px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.sheet{background:var(--card);border-radius:20px;box-shadow:0 10px 30px rgba(30,60,55,.12);overflow:hidden}
header.top{background:linear-gradient(120deg,#3f8f86,#2f6f8f 60%,#5b5fa8);color:#fff;text-align:center;padding:30px 16px 26px}
header.top h1{margin:0;font-size:clamp(22px,4vw,32px);font-weight:800;letter-spacing:-.5px;text-wrap:balance}
header.top p{margin:8px 0 0;opacity:.92;font-size:15px}
.inner{padding:26px clamp(14px,3vw,34px) 34px}
h2.q{font-size:19px;margin:0 0 16px}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.topic{background:#f7faf9;border:2px solid var(--line);border-radius:16px;padding:18px;text-align:left;cursor:pointer;transition:.15s;color:inherit}
.topic:hover{transform:translateY(-2px);border-color:var(--jade-line)}
.topic.on{border-color:var(--jade);background:var(--jade-soft);box-shadow:0 4px 14px rgba(63,143,134,.22)}
.topic .ic{font-size:34px;text-align:center;display:block;margin-bottom:8px}
.topic b{display:block;font-size:17px}
.topic .sub{display:block;color:var(--muted);font-size:13px;margin:4px 0 8px}
.topic .desc{display:block;font-size:13.5px}
.work{margin-top:26px;border-left:5px solid var(--jade);background:#f6faf9;border-radius:16px;padding:20px clamp(12px,2.5vw,24px)}
.work h2{margin:0 0 14px;font-size:20px}
.facts4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.fact{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
.fact b{display:block;color:var(--jade-dark);margin-bottom:4px}
details.more{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details.more summary{cursor:pointer;font-weight:700;color:var(--jade-dark)}
details.more ol{margin:10px 0 4px;padding-left:22px;font-size:14.5px}
details.more ol li{margin-bottom:6px}
.src{font-size:12.5px;color:var(--muted);margin-top:8px}
.words{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.word{background:var(--gold-soft);border:1px solid #ecd9ac;border-radius:999px;padding:4px 12px;font-size:13px}
.think{margin-top:14px;background:var(--blue-soft);border:1px solid #c9d9f0;border-radius:12px;padding:12px 16px;font-size:14.5px}
.think b{color:var(--blue)}
.think ul{margin:6px 0 0;padding-left:20px}
.quote{background:#fff;border-left:4px solid #9fb6dc;padding:6px 12px;margin:8px 0;border-radius:6px;font-size:14px}
.bookinfo{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin:20px 0 6px}
.bookinfo label{font-size:13px;font-weight:700;color:var(--muted)}
input.tx,textarea.tx{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink)}
input.tx:focus,textarea.tx:focus{outline:2px solid var(--jade-line);border-color:var(--jade)}
.editor{margin-top:16px;border:2px solid #7fb9b1;border-radius:16px;background:#f2f9f8;padding:18px clamp(10px,2vw,20px)}
.editor .head{font-weight:700}
.editor .head small{display:block;font-weight:400;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 4px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;color:var(--ink)}
.btn:hover{background:#f3f6f5}
.btn:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:default}
.btn.main{background:linear-gradient(120deg,var(--jade),#2f6f8f);color:#fff;border:0;font-weight:700;padding:11px 22px;border-radius:999px;box-shadow:0 4px 12px rgba(47,111,143,.3)}
.btn.del{color:var(--red);border-color:#f0c4c0}
.btn.sm{padding:4px 10px;font-size:13px}
.scene{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.scene .row1{display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-bottom:1px solid #eef2f1;padding-bottom:10px;margin-bottom:12px}
.num{width:30px;height:30px;border-radius:50%;background:var(--jade);color:#fff;display:grid;place-items:center;font-weight:800}
.row1 .sp{flex:1}
.scene .body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.fields label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 4px}
.scene input.tx{font-weight:700;margin-bottom:10px}
.guide{background:var(--gold-soft);border:1px solid #ecd9ac;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.guide b{color:var(--gold)}
.example{background:var(--ex);border:1px solid var(--ex-line);border-radius:10px;padding:10px 12px;font-size:14.5px}
.example .eh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.example .eh b{color:var(--blue)}
.example p{margin:0}
.fields textarea{min-height:150px;resize:vertical}
.count{font-size:12px;color:var(--muted);text-align:right}
.tips{margin-top:20px;background:var(--red-soft);border:1px solid #f2c9c4;border-radius:14px;padding:14px 18px}
.tips b{color:var(--red)}
.tips ul{margin:6px 0 0;padding-left:4px;list-style:none;font-size:14.5px}
.tips li::before{content:"✏️ "}
.check{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;font-size:14.5px}
.check label{display:block;margin:4px 0;cursor:pointer}
.finish{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px}
.empty{color:var(--muted);text-align:center;padding:24px 0 6px;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(20,30,30,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal[hidden]{display:none}
.modal .box{background:#fff;border-radius:16px;padding:22px;max-width:440px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal .box p{margin:0 0 16px;white-space:pre-line}
.modal .box .acts{display:flex;gap:8px;justify-content:flex-end}
.modal textarea{width:100%;height:240px;margin-bottom:12px;font-size:13px}
@media (max-width:720px){
  .scene .body{grid-template-columns:1fr}
  .bookinfo{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){ .topic,.toast{transition:none} }
</style>
</head>
<body>
<div class="wrap">
 <div class="sheet">
  <header class="top">
   <h1>고려 역사 그림책 장면 구상 활동지</h1>
   <p>장면별 글을 먼저 완성하고, 캔바에서 그림과 함께 그림책으로 만들어 보세요!</p>
  </header>
  <div class="inner">
   <h2 class="q">📚 어떤 이야기를 그림책으로 만들까요?</h2>
   <div class="topics" id="topics"></div>
   <div id="work"><p class="empty">위에서 이야기를 하나 골라 보세요. 👆</p></div>
  </div>
 </div>
</div>

<div class="modal" id="askModal" hidden><div class="box"><p id="askMsg"></p><div class="acts"><button class="btn" id="askNo">취소</button><button class="btn del" id="askYes">네, 할게요</button></div></div></div>
<div class="modal" id="copyModal" hidden><div class="box"><p>아래 글을 모두 선택(Ctrl+A)한 뒤 복사(Ctrl+C)해서 캔바에 붙여 넣으세요.</p><textarea class="tx" id="copyText" readonly></textarea><div class="acts"><button class="btn" id="copyClose">닫기</button></div></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="loadFile" accept=".json,application/json" hidden>

<script>
/* ───────────── 주제별 자료 ─────────────
   scenes: [장면 제목, 그림 아이디어, 예시 글] */
const TOPICS = {
 khitan:{
  icon:'🐫', name:'고려와 거란의 전쟁', sub:'외교 담판과 귀주 대첩',
  desc:'서희의 말솜씨와 강감찬의 지혜로 나라를 지킨 이야기',
  when:'993년~1019년, 거란이 세 번 고려에 쳐들어옴',
  where:'고려 북쪽(강동 6주), 개경, 귀주',
  who:'서희, 강감찬, 양규, 고려 군사와 백성, 거란 장수 소손녕',
  meaning:'외교와 끈질긴 싸움으로 나라를 지켰고, 고려·송·거란의 관계가 안정됨',
  facts:[
   '거란은 발해를 멸망시킨 나라였어요. 태조 왕건은 거란이 보낸 사신을 섬으로 보내고, 선물로 온 낙타 50마리를 만부교 다리 아래에 묶어 두었어요(942).',
   '거란의 1차 침입(993) 때 서희는 거란 장수 소손녕과 담판을 벌였어요. 고려는 송과 교류를 끊기로 약속하고 강동 6주 지역을 얻었어요.',
   '고려가 송과 관계를 계속 이어 가자 거란은 2차 침입(1010)을 했어요. 개경을 빼앗기기도 했지만 양규 등의 끈질긴 저항과 외교로 위기를 넘겼어요.',
   '거란은 강동 6주를 돌려 달라며 3차 침입(1018)을 했어요. 강감찬이 이끈 고려군은 1019년 귀주에서 거란군을 크게 물리쳤어요(귀주 대첩). 살아 돌아간 거란군은 겨우 수천 명이었다고 해요.',
   '전쟁 뒤 고려는 북쪽 국경에 천리장성을 쌓아 외적의 침입에 대비했어요.'
  ],
  source:'출처: 초등 사회 5-2 교과서 「고려와 주변 나라들의 관계」, 『고려사』',
  words:[['담판','서로 맞선 사람들이 의논해 옳고 그름을 판단함'],['강동 6주','서희의 담판으로 얻은 압록강 동쪽의 여섯 지역'],['송','960년~1279년 중국에 있었던 나라'],['천리장성','압록강 어귀에서 동해안까지 쌓은 긴 성']],
  think:['서희는 싸우지 않고 어떻게 땅을 얻을 수 있었을까요?','귀주 대첩에서 고려군이 이길 수 있었던 까닭은 무엇일까요?'],
  quotes:[],
  scenes:[
   ['거란의 낙타 선물과 왕건의 결정','거란 사신이 낙타 50마리를 끌고 온 모습, 단호한 표정의 왕건',
    '거란이 사신과 낙타 50마리를 보내 친하게 지내자고 했어요. 하지만 태조 왕건은 "발해를 멸망시킨 거란과는 친하게 지낼 수 없다!"라고 말했어요. 왕건은 사신을 섬으로 보내고, 낙타는 만부교 다리 아래에 묶어 두었어요.'],
   ['거란의 1차 침입 (993)','압록강을 건너오는 거란의 많은 군사, 걱정하는 고려 사람들',
    '993년, 거란의 많은 군사가 압록강을 건너 고려로 쳐들어왔어요. 거란 장수 소손녕은 "고려 땅을 내놓아라!" 하고 큰소리를 쳤어요. 고려 사람들은 걱정이 가득했어요.'],
   ['서희의 외교 담판','마주 앉은 서희와 소손녕, 서희의 당당한 표정과 말풍선',
    '서희는 거란 진영으로 찾아가 소손녕과 마주 앉았어요. "고려는 고구려를 이은 나라요. 여진이 길을 막고 있어 거란과 오가지 못했을 뿐이오." 서희의 당당한 말에 거란군은 물러났고, 고려는 강동 6주를 얻었어요.'],
   ['거란의 2차 침입 (1010)','불타는 개경, 끝까지 맞서 싸우는 양규와 고려 군사들',
    '고려가 송과 계속 사이좋게 지내자, 1010년 거란이 다시 쳐들어왔어요. 수도 개경까지 빼앗겼지만 양규 장군과 고려 군사들은 끝까지 싸우며 거란군을 괴롭혔어요. 결국 거란군은 물러갔어요.'],
   ['강감찬의 귀주 대첩 (1019)','바람이 고려군 쪽에서 부는 들판, 앞장선 강감찬과 달아나는 거란군',
    '1018년, 거란이 강동 6주를 돌려 달라며 또 쳐들어왔어요. 강감찬은 귀주에서 거란군을 기다렸어요. "바람의 방향이 바뀌었다! 공격하자!" 고려군은 거란군을 크게 물리쳤고, 살아 돌아간 거란군은 겨우 수천 명이었어요.'],
   ['천리장성을 쌓다','힘을 모아 긴 성을 쌓는 사람들, 평화로워진 마을',
    '전쟁이 끝난 뒤 고려는 다시는 침입을 당하지 않도록 북쪽 국경에 긴 성을 쌓았어요. 압록강 어귀에서 동해안까지 이어지는 천리장성이에요. 백성들의 생활도 점차 편안해졌어요.']
  ],
  tips:['서희와 강감찬은 고려 관리의 옷(관복)을 입은 모습이 어울려요','거란군은 말을 탄 모습으로 넣으면 고려군과 구분하기 쉬워요','압록강, 강동 6주, 귀주가 표시된 지도를 한 장면에 넣어 보세요','담판 장면은 두 사람의 표정과 말풍선이 중요해요']
 },
 jurchen:{
  icon:'🏯', name:'고려와 여진의 전쟁', sub:'윤관과 동북 9성',
  desc:'별무반을 만들어 9성을 쌓았지만 다시 돌려준 이야기',
  when:'1104년~1109년 (본격적인 정벌은 1107년)',
  where:'고려의 동북쪽 국경 너머 (지금의 함경도 지역)',
  who:'윤관, 오연총, 숙종과 예종, 별무반, 여진(완안부)',
  meaning:'크게 이겨 9성을 쌓았지만 지키기 어려워 2년 만에 돌려줌. 여진은 그 뒤 금나라를 세움',
  facts:[
   '고려와 여진은 오랫동안 대체로 사이가 좋았어요. 그런데 11세기 후반 여진의 완안부가 여러 부족을 모으며 강해졌고, 고려 국경 가까이까지 세력을 넓혔어요.',
   '1104년 고려군은 여진에게 두 번 크게 졌어요. 윤관도 군사의 절반 이상이 다치거나 죽는 피해를 입고, 여진과 화해를 맺고 돌아왔어요.',
   '윤관은 "말을 탄 여진 기병에게 걸어서 싸우는 고려 보병이 이기기 어렵다"고 보고, 숙종에게 새 군대인 별무반을 만들자고 건의했어요. 별무반은 신기군(말 탄 군사), 신보군(걸어서 싸우는 군사), 항마군(승려 군사)으로 이루어졌어요.',
   '숙종이 세상을 떠난 뒤, 예종은 1107년 윤관을 대장(원수), 오연총을 부대장(부원수)으로 삼아 17만 명의 군대를 보냈어요. 고려군은 빠르게 나아가 큰 승리를 거두었어요.',
   '윤관은 새로 얻은 땅에 성을 쌓아 9성을 완성하고, 공험진에 비석을 세워 국경을 정했어요. 남쪽 지방의 백성 수만 집을 옮겨 살게 했어요.',

const ORDER = ['khitan','jurchen','mongol','culture'];

/* ───────────── 저장 ───────────── */
const KEY = 'goryeoPictureBook_v2';
let store = {};
try{ store = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ store = {}; }
let cur = null;
let saveTimer = null;
function saveNow(){
  try{ localStorage.setItem(KEY, JSON.stringify(store)); }
  catch(e){ toast('⚠️ 자동 저장이 되지 않았어요. [파일로 저장]을 눌러 보관하세요.'); }
}
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 400); }
const uid = () => Math.random().toString(36).slice(2,9);
function bookFor(key){
  if(!store[key]){
    const T = TOPICS[key];
    store[key] = {title:T.name+' 이야기', author:'', scenes:T.scenes.map(([t,g,ex])=>({id:uid(), title:t, guide:g, example:ex, text:''}))};
  }
  return store[key];
}
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('show'), 2400);
}
/* claude.ai에 올린 페이지 안에서는 다운로드가 막혀 있어 downloads 기능으로 대신함 */
const inViewer = () => !!(window.claude && window.claude.use);
function askConfirm(msg){
  return new Promise(res=>{
    const m = document.getElementById('askModal');
    document.getElementById('askMsg').textContent = msg;
    m.hidden = false;
    const done = v => { m.hidden = true; res(v); };
    document.getElementById('askYes').onclick = () => done(true);
    document.getElementById('askNo').onclick = () => done(false);
  });
}
async function offerFile(filename, data, okMsg){
  if(inViewer()){
    const dl = await window.claude.use('downloads');
    if(!dl){ toast('이 화면에서는 파일을 받을 수 없어요.'); return; }
    try{ await dl.save({filename, data}); toast(okMsg); }
    catch(e){ if(e && e.code!=='declined') toast('파일을 받지 못했어요. 잠시 뒤 다시 눌러 보세요.'); }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data]));
  a.download = filename; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  toast(okMsg);
}
const safeName = s => String(s).replace(/[\\/:*?"<>|]/g,'').trim();
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ───────────── 주제 카드 ───────────── */
function renderTopics(){
  document.getElementById('topics').innerHTML = ORDER.map(k=>{
    const T = TOPICS[k];
    return `<button class="topic ${cur===k?'on':''}" data-k="${k}">
      <span class="ic">${T.icon}</span><b>${T.name}</b><span class="sub">${T.sub}</span><span class="desc">${T.desc}</span></button>`;
  }).join('');
  document.querySelectorAll('.topic').forEach(b=>b.onclick=()=>{ cur=b.dataset.k; renderTopics(); renderWork(); document.getElementById('work').scrollIntoView({behavior:'smooth'}); });
}

/* ───────────── 활동 영역 ───────────── */
function renderWork(){
  const T = TOPICS[cur], B = bookFor(cur);
  document.getElementById('work').innerHTML = `

      <div class="fact"><b>🌟 의미</b>${T.meaning}</div>

    <details class="more">

    <div class="bookinfo">
      <div><label for="bTitle">📕 내 그림책 제목</label><input class="tx" id="bTitle" value="${esc(B.title)}" maxlength="40"></div>
      <div><label for="bAuthor">✍️ 지은이</label><input class="tx" id="bAuthor" value="${esc(B.author)}" placeholder="예) 5학년 2반 홍길동" maxlength="30"></div>
    </div>

    <div class="editor">
      <div class="head">✨ 나만의 그림책 장면 편집하기<small>예시 글을 읽고, 내 말로 바꾸어 써 보세요. 장면을 고치거나 새 장면을 넣어도 좋아요. 완성한 글은 [캔바용 글 복사하기]로 옮길 수 있어요.</small></div>
      <div class="bar"><button class="btn main" id="addEnd">＋ 새 장면 추가하기</button></div>
      <div id="scenes"></div>
    </div>

    <div class="tips"><b>🎨 캔바에서 그림을 넣을 때 팁</b><ul>${T.tips.map(t=>`<li>${t}</li>`).join('')}</ul></div>

    <div class="check"><b>✅ 완성하기 전에 확인해요</b>
      <label><input type="checkbox"> 날짜, 장소, 인물 이름을 역사 사실대로 썼나요?</label>
      <label><input type="checkbox"> 장면의 순서가 일이 일어난 순서와 맞나요?</label>
      <label><input type="checkbox"> 예시 글을 그대로 옮기지 않고 내 말로 바꾸어 썼나요?</label>
      <label><input type="checkbox"> 마지막 장면에 이 사건의 의미나 나의 생각을 담았나요?</label>
    </div>

    <div class="finish">
      <button class="btn main" id="doCopy">📋 캔바용 글 복사하기</button>
      <button class="btn" id="doTxt">📄 글 파일(.txt) 받기</button>
      <button class="btn" id="doExport">💾 파일로 저장</button>
      <button class="btn" id="doImport">📂 파일 불러오기</button>
      <button class="btn del" id="doReset">↺ 처음 상태로</button>
    </div>
  </div>`;
  document.getElementById('bTitle').oninput = e => { B.title = e.target.value; save(); };
  document.getElementById('bAuthor').oninput = e => { B.author = e.target.value; save(); };
  document.getElementById('addEnd').onclick = () => { B.scenes.push(blankScene()); saveNow(); renderScenes(); scrollToScene(B.scenes.length-1); };
  document.getElementById('doCopy').onclick = copyAll;
  document.getElementById('doTxt').onclick = () => { saveNow(); offerFile(`${safeName(B.title)||'그림책'}.txt`, bookText(), '글 파일을 받았어요.'); };
  document.getElementById('doExport').onclick = exportFile;
  document.getElementById('doImport').onclick = () => document.getElementById('loadFile').click();
  document.getElementById('doReset').onclick = async () => {
    if(!await askConfirm('이 주제에 쓴 글이 모두 지워지고 처음 장면으로 돌아가요. 계속할까요?')) return;
    delete store[cur]; saveNow(); renderWork();
  };
  renderScenes();
}
const blankScene = () => ({id:uid(), title:'', guide:'', example:'', text:''});
function scrollToScene(i){ const el = document.querySelectorAll('.scene')[i]; if(el) el.scrollIntoView({behavior:'smooth', block:'center'}); }

/* ───────────── 장면 카드 ───────────── */
function renderScenes(){
  const B = bookFor(cur), box = document.getElementById('scenes');
  box.innerHTML = '';
  B.scenes.forEach((s,i)=>{
    const el = document.createElement('div');
    el.className = 'scene';
    el.innerHTML = `
      <div class="row1">
        <span class="num">${i+1}</span>
        <button class="btn sm" data-a="up" ${i===0?'disabled':''} title="위로">↑</button>
        <button class="btn sm" data-a="down" ${i===B.scenes.length-1?'disabled':''} title="아래로">↓</button>
        <span class="sp"></span>
        <button class="btn sm" data-a="ins">사이에 추가</button>
        <button class="btn sm del" data-a="del">삭제</button>
      </div>
      <input class="tx" data-f="title" value="${esc(s.title)}" placeholder="장면 제목을 써 보세요" maxlength="40" aria-label="장면 제목">
      <div class="body">
        <div>
          <div class="guide"><b>🎨 그림 아이디어</b><br>${s.guide?esc(s.guide):'이 장면에 어떤 그림을 넣을지 생각해 보세요.'}</div>
          ${s.example?`<div class="example"><div class="eh"><b>📝 예시 글</b><button class="btn sm" data-a="useEx">예시 글 가져오기</button></div><p>${esc(s.example)}</p></div>`:''}
        </div>
        <div class="fields">
          <label>✍️ 내가 쓸 글</label>
          <textarea class="tx" data-f="text" maxlength="300" placeholder="이 장면에서 일어난 일을 2~3문장으로 써 보세요.&#10;인물의 말은 &quot; &quot; 안에 써요.">${esc(s.text)}</textarea>
          <div class="count">${s.text.length} / 300자</div>
        </div>
      </div>`;
    el.querySelectorAll('[data-f]').forEach(inp=>inp.oninput = e => {
      s[inp.dataset.f] = e.target.value; save();
      if(inp.dataset.f==='text') el.querySelector('.count').textContent = `${e.target.value.length} / 300자`;
    });
    el.querySelectorAll('[data-a]').forEach(b=>b.onclick = async () => {
      const a = b.dataset.a;
      if(a==='useEx'){
        if(s.text && !await askConfirm('지금 쓴 글이 예시 글로 바뀌어요. 계속할까요?')) return;
        s.text = s.example; saveNow();
        const ta = el.querySelector('textarea'); ta.value = s.text; ta.focus();
        el.querySelector('.count').textContent = `${s.text.length} / 300자`;
        toast('예시 글을 가져왔어요. 내 말로 바꾸어 써 보세요!');
        return;
      }
      if(a==='up'){ [B.scenes[i-1],B.scenes[i]] = [B.scenes[i],B.scenes[i-1]]; }
      if(a==='down'){ [B.scenes[i+1],B.scenes[i]] = [B.scenes[i],B.scenes[i+1]]; }
      if(a==='ins'){ B.scenes.splice(i+1,0,blankScene()); }
      if(a==='del'){
        if(B.scenes.length===1){ toast('장면이 하나는 있어야 해요.'); return; }
        if(!await askConfirm(`${i+1}번 장면을 삭제할까요?`)) return;
        B.scenes.splice(i,1);
      }
      saveNow(); renderScenes();
      if(a==='ins') scrollToScene(i+1);
    });
    box.appendChild(el);
  });
}

/* ───────────── 캔바로 옮기기 ───────────── */
function bookText(){
  const B = bookFor(cur);
  const lines = [`[${B.title||TOPICS[cur].name}]`];
  if(B.author) lines.push(`지은이: ${B.author}`);
  B.scenes.forEach((s,i)=>{
    lines.push('', `${i+1}. ${s.title||'(제목 없음)'}`);
    lines.push(s.text.trim() || '(아직 글을 쓰지 않았어요)');
    if(s.guide) lines.push(`(그림: ${s.guide})`);
  });
  return lines.join('\n');
}
async function copyAll(){
  saveNow();
  const t = bookText();
  try{ await navigator.clipboard.writeText(t); toast('복사했어요! 캔바에서 Ctrl+V로 붙여 넣으세요.'); }
  catch(e){
    const m = document.getElementById('copyModal'), ta = document.getElementById('copyText');
    ta.value = t; m.hidden = false; ta.focus(); ta.select();
  }
}
document.getElementById('copyClose').onclick = () => document.getElementById('copyModal').hidden = true;

/* ───────────── 파일 저장 / 불러오기 ───────────── */
function exportFile(){
  saveNow();
  const B = bookFor(cur);
  offerFile(`${safeName(B.author)||'그림책'}_${TOPICS[cur].name}.json`,
    JSON.stringify({app:'goryeo-book', topic:cur, book:B}),
    '파일로 저장했어요. 다른 컴퓨터에서 [파일 불러오기]로 이어서 할 수 있어요.');
}
document.getElementById('loadFile').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = async () => {
    try{
      const d = JSON.parse(rd.result);
      if(d.app!=='goryeo-book' || !TOPICS[d.topic] || !Array.isArray(d.book?.scenes)) throw 0;
      if(store[d.topic] && !await askConfirm(`「${TOPICS[d.topic].name}」에 지금 쓴 내용이 있어요. 불러온 파일로 바꿀까요?`)) return;
      d.book.scenes.forEach(s=>{ s.text = s.text||''; s.example = s.example||''; s.guide = s.guide||''; });
      store[d.topic] = d.book; saveNow(); cur = d.topic; renderTopics(); renderWork(); toast('그림책을 불러왔어요!');
    }catch(err){ toast('이 앱에서 저장한 그림책 파일이 아니에요.'); }
  };
  rd.readAsText(f); e.target.value = '';
};

renderTopics();
</script>
